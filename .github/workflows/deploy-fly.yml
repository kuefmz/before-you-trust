name: Deploy Fly (manual migration)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: before-you-trust-fly
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to existing kiss-ai app
        run: flyctl deploy --remote-only --app kiss-ai --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
