# Reuses the existing Kiss AI frontend Fly app; deployment is manual until approved.
app = "kiss-ai"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SEARCH_PROVIDER = "auto"
  YACY_RESOURCE = "global"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
