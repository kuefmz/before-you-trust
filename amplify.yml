version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        # Public values are safe to expose to Next.js at build time.
        - env | grep -e '^NEXT_PUBLIC_' >> .env.production || true
        # YaCy endpoint/mode are server configuration, but not credentials.
        - env | grep -E '^(SEARCH_PROVIDER|YACY_BASE_URL|YACY_RESOURCE)=' >> .env.production || true
        # This is only an SSM parameter name, never the secret value itself.
        - env | grep -e '^RUNTIME_SECRETS_PARAMETER=' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
