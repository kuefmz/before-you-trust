# Before You Trust API on the existing Fly backend app.
app = "kiss-ai-backend"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SEARCH_PROVIDER = "searxng"
  SEARXNG_BASE_URL = "http://kiss-ai.internal:8080"
  YACY_RESOURCE = "global"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
