name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: before-you-trust-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to AWS Amplify
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      AMPLIFY_BRANCH: main

    steps:
      - name: Resolve release commit
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm tested commit is still main HEAD
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"

          echo "CI-tested SHA: $RELEASE_SHA"
          echo "Current main:   $current_sha"

          if [[ "$current_sha" != "$RELEASE_SHA" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer main commit exists. Skipping this older release; the newer commit will deploy after its own CI passes."
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Validate deployment configuration
        if: steps.head.outputs.deploy == 'true'
        shell: bash
        run: |
          missing=0

          for name in AWS_REGION AMPLIFY_APP_ID AWS_ROLE_TO_ASSUME; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub Actions variable $name is not configured."
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo
            echo "Configure the repository Actions variables documented in docs/15-PRODUCTION-DEPLOYMENT.md."
            exit 1
          fi

          echo "Release commit: ${{ steps.release.outputs.sha }}"
          echo "Amplify app: $AMPLIFY_APP_ID"
          echo "Amplify branch: $AMPLIFY_BRANCH"
          echo "AWS region: $AWS_REGION"

      - name: Configure AWS credentials with GitHub OIDC
        if: steps.head.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: before-you-trust-production

      - name: Start Amplify release
        if: steps.head.outputs.deploy == 'true'
        id: amplify
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          response="$(
            aws amplify start-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-type RELEASE \
              --job-reason "GitHub Actions production release $RELEASE_SHA" \
              --commit-id "$RELEASE_SHA" \
              --commit-message "Deploy $RELEASE_SHA after CI passed" \
              --output json
          )"

          job_id="$(jq -r '.jobSummary.jobId // empty' <<< "$response")"
          amplify_sha="$(jq -r '.jobSummary.commitId // empty' <<< "$response")"

          if [[ -z "$job_id" ]]; then
            echo "::error::Amplify did not return a deployment job id."
            exit 1
          fi

          echo "Started Amplify job $job_id for commit $amplify_sha."

          if [[ -n "$amplify_sha" && "$amplify_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Amplify started the wrong commit ($amplify_sha instead of $RELEASE_SHA). Stopping the job."
            aws amplify stop-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$job_id" >/dev/null
            exit 1
          fi

          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Amplify deployment
        if: steps.head.outputs.deploy == 'true'
        shell: bash
        env:
          JOB_ID: ${{ steps.amplify.outputs.job_id }}
        run: |
          for attempt in {1..120}; do
            status="$(
              aws amplify get-job \
                --app-id "$AMPLIFY_APP_ID" \
                --branch-name "$AMPLIFY_BRANCH" \
                --job-id "$JOB_ID" \
                --query 'job.summary.status' \
                --output text
            )"

            echo "Amplify status: $status"

            case "$status" in
              SUCCEED)
                echo "Production deployment succeeded."
                exit 0
                ;;
              FAILED|CANCELLED)
                echo "::error::Amplify deployment ended with status $status."
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done

          echo "::error::Timed out waiting for Amplify deployment."
          exit 1
